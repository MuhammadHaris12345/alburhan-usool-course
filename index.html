<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALBURHAN AL USOOL COURSE</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #134e4a 100%); min-height: 100vh; color: #f1f5f9; direction: rtl; }
    header { background: linear-gradient(135deg, #0f766e, #10b981); padding: 1.5rem 1rem; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    header h1 { font-size: 1.8rem; font-weight: 700; color: #fff; display: flex; align-items: center; justify-content: center; gap: .6rem; flex-wrap: wrap; }
    header p { color: #99f6e4; margin-top: .3rem; font-size: 1rem; }
    .ayat-box { background: linear-gradient(145deg, #fefce8, #fef08a); border: 3px solid #854d0e; border-radius: 1rem; max-width: 750px; margin: 1.2rem auto; padding: 1.5rem; text-align: center; color: #1c1917; direction: rtl; }
    .ayat-arabic { font-size: 1.7rem; line-height: 2.5rem; font-family: serif; margin-bottom: .8rem; color: #1c1917; }
    .ayat-urdu { font-size: 1rem; color: #065f46; font-weight: 600; margin-bottom: .4rem; }
    .ayat-ref { font-size: .85rem; color: #92400e; font-weight: 500; }
    .tabs { display: flex; justify-content: center; gap: .6rem; padding: 1rem; flex-wrap: wrap; }
    .tab-btn { padding: .65rem 1.8rem; border-radius: 2rem; border: none; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all .2s; font-family: inherit; }
    .tab-btn.student { background: #0f766e; color: #fff; }
    .tab-btn.admin { background: #334155; color: #fff; }
    .tab-btn:hover { opacity: .85; transform: translateY(-1px); }
    .panel { display: none; max-width: 820px; margin: 0 auto; padding: 0 1rem 2rem; }
    .panel.active { display: block; }
    .card { background: rgba(15,23,42,0.88); border: 1px solid rgba(20,184,166,0.3); border-radius: 1rem; padding: 1.5rem; margin-bottom: 1rem; }
    .card h2 { color: #2dd4bf; font-size: 1.2rem; margin-bottom: 1rem; }
    .inp { width: 100%; padding: .85rem 1rem; border-radius: .75rem; background: #1e293b; border: 1px solid #334155; color: #f1f5f9; font-size: 1rem; outline: none; margin-bottom: .75rem; font-family: inherit; direction: rtl; transition: border .2s; }
    .inp:focus { border-color: #2dd4bf; }
    .btn { width: 100%; padding: .85rem; border-radius: .75rem; border: none; font-size: 1rem; font-weight: 700; cursor: pointer; font-family: inherit; transition: all .2s; margin-top: .2rem; }
    .btn:hover { opacity: .9; transform: translateY(-1px); }
    .btn:active { transform: scale(.98); }
    .btn-teal { background: #0f766e; color: #fff; }
    .btn-amber { background: #d97706; color: #fff; }
    .btn-red { background: #dc2626; color: #fff; }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-sm { width: auto; padding: .45rem 1rem; font-size: .85rem; }
    .msg { padding: .75rem 1rem; border-radius: .5rem; margin-bottom: .75rem; font-size: .9rem; font-weight: 600; display: none; }
    .msg.success { background: rgba(16,185,129,0.15); border: 1px solid #10b981; color: #6ee7b7; display: block; }
    .msg.error { background: rgba(220,38,38,0.15); border: 1px solid #dc2626; color: #fca5a5; display: block; }
    .msg.info { background: rgba(59,130,246,0.15); border: 1px solid #3b82f6; color: #93c5fd; display: block; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: .75rem; margin-bottom: 1rem; }
    .stat { background: rgba(30,41,59,0.8); border: 1px solid rgba(51,65,85,0.5); border-radius: .75rem; padding: 1rem; text-align: center; }
    .stat-num { font-size: 1.8rem; font-weight: 700; color: #2dd4bf; }
    .stat-label { font-size: .75rem; color: #94a3b8; margin-top: .2rem; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; min-width: 500px; }
    th { background: #1e293b; padding: .75rem; text-align: right; color: #2dd4bf; border-bottom: 1px solid #334155; }
    td { padding: .75rem; border-bottom: 1px solid rgba(51,65,85,0.4); color: #cbd5e1; vertical-align: top; }
    tr:hover td { background: rgba(30,41,59,0.5); }
    .badge { display: inline-block; padding: .2rem .45rem; border-radius: .3rem; font-size: .72rem; font-weight: 600; background: rgba(20,184,166,0.2); color: #2dd4bf; margin: .1rem; }
    .del-btn { background: rgba(220,38,38,0.15); border: 1px solid rgba(220,38,38,0.3); color: #fca5a5; padding: .25rem .6rem; border-radius: .3rem; cursor: pointer; font-size: .78rem; font-family: inherit; }
    .del-btn:hover { background: rgba(220,38,38,0.3); }
    .loading { text-align: center; padding: 2rem; color: #94a3b8; font-size: 1rem; }
    .my-record-box { background: rgba(16,185,129,0.1); border: 1px solid #10b981; border-radius: .75rem; padding: 1rem; margin-top: 1rem; }
    .my-record-box p { color: #6ee7b7; margin-bottom: .4rem; }
    .admin-btns { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; justify-content: space-between; }
    @media (max-width: 600px) {
      header h1 { font-size: 1.3rem; }
      .ayat-arabic { font-size: 1.3rem; line-height: 2rem; }
    }
  </style>
</head>
<body>

<header>
  <h1><i class="fas fa-book-quran" style="color:#fcd34d"></i> ALBURHAN AL USOOL COURSE</h1>
  <p>طلبِ علم کی سعادت</p>
</header>

<!-- Weekly Ayat -->
<div class="ayat-box">
  <div class="ayat-arabic" id="ayatArabic"></div>
  <div class="ayat-urdu" id="ayatUrdu"></div>
  <div class="ayat-ref" id="ayatRef"></div>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab-btn student" onclick="switchTab('student')">👨‍🎓 طالب علم</button>
  <button class="tab-btn admin" onclick="switchTab('admin')">🔐 ایڈمن پینل</button>
</div>

<!-- Student Panel -->
<div id="studentPanel" class="panel active">

  <!-- Registration -->
  <div class="card">
    <h2>📝 نئی رجسٹریشن</h2>
    <div id="regMsg" class="msg"></div>
    <input class="inp" id="regName" type="text" placeholder="آپ کا مکمل نام">
    <input class="inp" id="regNum" type="tel" placeholder="واٹس ایپ نمبر (03XXXXXXXXX)">
    <button class="btn btn-teal" onclick="registerStudent()">✅ رجسٹر کریں</button>
  </div>

  <!-- Mark Attendance -->
  <div class="card">
    <h2>📅 حاضری لگائیں</h2>
    <div id="attMsg" class="msg"></div>
    <input class="inp" id="attNum" type="tel" placeholder="اپنا رجسٹرڈ واٹس ایپ نمبر">
    <input class="inp" id="attDate" type="date">
    <button class="btn btn-amber" onclick="markAttendance()">✋ حاضری لگائیں</button>
  </div>

  <!-- Check My Attendance -->
  <div class="card">
    <h2>🔍 اپنی حاضری دیکھیں</h2>
    <div id="checkMsg" class="msg"></div>
    <input class="inp" id="checkNum" type="tel" placeholder="اپنا واٹس ایپ نمبر">
    <button class="btn btn-green" onclick="checkMyAttendance()">📊 ریکارڈ دیکھیں</button>
    <div id="myRecord" style="display:none"></div>
  </div>

</div>

<!-- Admin Panel -->
<div id="adminPanel" class="panel">

  <div class="card" id="loginCard">
    <h2>🔐 ایڈمن لاگ ان</h2>
    <div id="loginMsg" class="msg"></div>
    <input class="inp" id="adminPass" type="password" placeholder="پاس ورڈ درج کریں">
    <button class="btn btn-red" onclick="adminLogin()">🔑 لاگ ان کریں</button>
  </div>

  <div id="dashboard" style="display:none">
    <div class="stat-grid" id="statsGrid">
      <div class="stat"><div class="stat-num" id="statTotal">—</div><div class="stat-label">کل طلباء</div></div>
      <div class="stat"><div class="stat-num" id="statAtt">—</div><div class="stat-label">کل حاضری</div></div>
      <div class="stat"><div class="stat-num" id="statActive">—</div><div class="stat-label">فعال طلباء</div></div>
    </div>

    <div class="card">
      <div class="admin-btns">
        <h2 style="margin:0">👥 تمام طلباء</h2>
        <div style="display:flex;gap:.5rem">
          <button class="btn btn-teal btn-sm" onclick="loadAdminData()">🔄 ریفریش</button>
          <button class="btn btn-green btn-sm" onclick="downloadCSV()">📥 Excel ڈاؤن لوڈ</button>
        </div>
      </div>
      <div id="tableLoading" class="loading">⏳ ڈیٹا لوڈ ہو رہا ہے...</div>
      <div class="table-wrap" id="tableWrap" style="display:none">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>نام</th>
              <th>واٹس ایپ نمبر</th>
              <th>کل حاضری</th>
              <th>حاضری کی تاریخیں</th>
              <th>حذف</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, getDocs, addDoc, updateDoc,
    deleteDoc, doc, query, where
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ===================== FIREBASE CONFIG =====================
  const firebaseConfig = {
    apiKey: "AIzaSyBL1QpXUD-OiNcXKPjVG0xkGLqGL3E3L90",
    authDomain: "alburhan-course.firebaseapp.com",
    projectId: "alburhan-course",
    storageBucket: "alburhan-course.firebasestorage.app",
    messagingSenderId: "240494620588",
    appId: "1:240494620588:web:1399c0dc333d530ca71409"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const STUDENTS = collection(db, "students");

  // ===================== ADMIN PASSWORD =====================
  const ADMIN_PASS = "Admin123#";

  // ===================== WEEKLY AYAT =====================
  const ayats = [
    { arabic: "وَقُلْ رَّبِّ زِدْنِي عِلْمًا", urdu: "اور کہو: اے میرے رب! میرے علم میں اضافہ فرما۔", ref: "سورۃ طہٰ – 20:114" },
    { arabic: "يَرْفَعِ اللَّهُ الَّذِينَ آمَنُوا مِنكُمْ وَالَّذِينَ أُوتُوا الْعِلْمَ دَرَجَاتٍ", urdu: "اللہ تم میں سے ایمان والوں اور علم والوں کے درجات بلند کرتا ہے۔", ref: "سورۃ المجادلہ – 58:11" },
    { arabic: "اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ", urdu: "پڑھو اپنے رب کے نام سے جس نے پیدا کیا۔", ref: "سورۃ العلق – 96:1" },
    { arabic: "إِنَّمَا يَخْشَى اللَّهَ مِنْ عِبَادِهِ الْعُلَمَاءُ", urdu: "اللہ کے بندوں میں سے صرف علماء ہی اللہ سے ڈرتے ہیں۔", ref: "سورۃ فاطر – 35:28" }
  ];
  const w = Math.floor(Date.now() / (1000 * 60 * 60 * 24 * 7)) % ayats.length;
  document.getElementById('ayatArabic').textContent = ayats[w].arabic;
  document.getElementById('ayatUrdu').textContent = ayats[w].urdu;
  document.getElementById('ayatRef').textContent = ayats[w].ref;

  // ===================== HELPERS =====================
  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg ' + type;
    setTimeout(() => { el.className = 'msg'; el.textContent = ''; }, 5000);
  }

  function setLoading(id, on) {
    const el = document.getElementById(id);
    if (el) el.disabled = on;
  }

  // ===================== TABS =====================
  window.switchTab = function(t) {
    document.getElementById('studentPanel').className = 'panel' + (t === 'student' ? ' active' : '');
    document.getElementById('adminPanel').className = 'panel' + (t === 'admin' ? ' active' : '');
  };

  // ===================== REGISTER =====================
  window.registerStudent = async function() {
    const name = document.getElementById('regName').value.trim();
    const num = document.getElementById('regNum').value.trim();

    if (!name || !num) { showMsg('regMsg', '❌ نام اور نمبر دونوں لازمی ہیں', 'error'); return; }
    if (!/^03\d{9}$/.test(num)) { showMsg('regMsg', '❌ نمبر درست فارمیٹ میں درج کریں: 03XXXXXXXXX', 'error'); return; }

    showMsg('regMsg', '⏳ رجسٹریشن ہو رہی ہے...', 'info');

    try {
      // Check duplicate
      const q = query(STUDENTS, where("number", "==", num));
      const snap = await getDocs(q);
      if (!snap.empty) { showMsg('regMsg', '❌ یہ نمبر پہلے سے رجسٹرڈ ہے!', 'error'); return; }

      await addDoc(STUDENTS, { name, number: num, attendance: {}, createdAt: Date.now() });
      showMsg('regMsg', '✅ رجسٹریشن کامیاب! خوش آمدید ' + name, 'success');
      document.getElementById('regName').value = '';
      document.getElementById('regNum').value = '';
    } catch (e) {
      showMsg('regMsg', '❌ ایرر: ' + e.message, 'error');
    }
  };

  // ===================== MARK ATTENDANCE =====================
  window.markAttendance = async function() {
    const num = document.getElementById('attNum').value.trim();
    const date = document.getElementById('attDate').value;

    if (!num || !date) { showMsg('attMsg', '❌ نمبر اور تاریخ دونوں درج کریں', 'error'); return; }

    const sel = new Date(date);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    if (sel < today) { showMsg('attMsg', '❌ پچھلی تاریخ پر حاضری نہیں لگا سکتے!', 'error'); return; }

    const day = sel.getDay();
    if (day !== 6 && day !== 0) { showMsg('attMsg', '❌ صرف ہفتہ اور اتوار کو حاضری ہوتی ہے!', 'error'); return; }

    showMsg('attMsg', '⏳ حاضری لگ رہی ہے...', 'info');

    try {
      const q = query(STUDENTS, where("number", "==", num));
      const snap = await getDocs(q);
      if (snap.empty) { showMsg('attMsg', '❌ یہ نمبر رجسٹرڈ نہیں ہے!', 'error'); return; }

      const docRef = snap.docs[0];
      const data = docRef.data();
      const attendance = data.attendance || {};

      if (attendance[date]) { showMsg('attMsg', '⚠️ اس تاریخ کی حاضری پہلے ہی لگ چکی ہے!', 'error'); return; }

      attendance[date] = true;
      await updateDoc(doc(db, "students", docRef.id), { attendance });
      showMsg('attMsg', '✅ ' + date + ' کی حاضری کامیابی سے لگ گئی! (' + data.name + ')', 'success');
    } catch (e) {
      showMsg('attMsg', '❌ ایرر: ' + e.message, 'error');
    }
  };

  // ===================== CHECK MY ATTENDANCE =====================
  window.checkMyAttendance = async function() {
    const num = document.getElementById('checkNum').value.trim();
    if (!num) { showMsg('checkMsg', '❌ نمبر درج کریں', 'error'); return; }

    showMsg('checkMsg', '⏳ ریکارڈ ڈھونڈ رہے ہیں...', 'info');

    try {
      const q = query(STUDENTS, where("number", "==", num));
      const snap = await getDocs(q);

      if (snap.empty) { showMsg('checkMsg', '❌ یہ نمبر رجسٹرڈ نہیں ہے', 'error'); document.getElementById('myRecord').style.display = 'none'; return; }

      const data = snap.docs[0].data();
      const dates = Object.keys(data.attendance || {}).sort();

      const box = document.getElementById('myRecord');
      box.style.display = 'block';
      box.innerHTML = `<div class="my-record-box">
        <p><strong>نام:</strong> ${data.name}</p>
        <p><strong>نمبر:</strong> <span style="direction:ltr;display:inline-block">${data.number}</span></p>
        <p style="color:#fcd34d;font-size:1.1rem;margin:.5rem 0"><strong>کل حاضری: ${dates.length} دن</strong></p>
        <div style="margin-top:.5rem">${dates.length ? dates.map(d => `<span class="badge">${d}</span>`).join('') : '<span style="color:#94a3b8">ابھی تک کوئی حاضری نہیں</span>'}</div>
      </div>`;
      showMsg('checkMsg', '✅ ریکارڈ مل گیا', 'success');
    } catch (e) {
      showMsg('checkMsg', '❌ ایرر: ' + e.message, 'error');
    }
  };

  // ===================== ADMIN LOGIN =====================
  window.adminLogin = function() {
    const p = document.getElementById('adminPass').value;
    if (p === ADMIN_PASS) {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadAdminData();
    } else {
      showMsg('loginMsg', '❌ غلط پاس ورڈ!', 'error');
    }
  };

  // ===================== LOAD ADMIN DATA =====================
  let allStudents = [];

  window.loadAdminData = async function() {
    document.getElementById('tableLoading').style.display = 'block';
    document.getElementById('tableWrap').style.display = 'none';

    try {
      const snap = await getDocs(STUDENTS);
      allStudents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      allStudents.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      renderTable();
      renderStats();
    } catch (e) {
      document.getElementById('tableLoading').textContent = '❌ ڈیٹا لوڈ نہیں ہوا: ' + e.message;
    }
  };

  function renderStats() {
    const total = allStudents.length;
    const totalAtt = allStudents.reduce((a, s) => a + Object.keys(s.attendance || {}).length, 0);
    const active = allStudents.filter(s => Object.keys(s.attendance || {}).length > 0).length;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statAtt').textContent = totalAtt;
    document.getElementById('statActive').textContent = active;
  }

  function renderTable() {
    document.getElementById('tableLoading').style.display = 'none';
    document.getElementById('tableWrap').style.display = 'block';
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    if (!allStudents.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:2rem">ابھی کوئی طالب علم رجسٹرڈ نہیں</td></tr>';
      return;
    }

    allStudents.forEach((s, i) => {
      const dates = Object.keys(s.attendance || {}).sort();
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${i + 1}</td>
        <td>${s.name}</td>
        <td style="direction:ltr;text-align:right">${s.number}</td>
        <td style="text-align:center;color:#2dd4bf;font-weight:700">${dates.length}</td>
        <td>${dates.map(d => `<span class="badge">${d}</span>`).join('') || '<span style="color:#64748b">—</span>'}</td>
        <td><button class="del-btn" onclick="deleteStudent('${s.id}', '${s.name}')">🗑 حذف</button></td>`;
      tbody.appendChild(tr);
    });
  }

  // ===================== DELETE STUDENT =====================
  window.deleteStudent = async function(id, name) {
    if (!confirm(`کیا آپ واقعی "${name}" کو حذف کرنا چاہتے ہیں؟\nیہ عمل واپس نہیں ہو گا!`)) return;
    try {
      await deleteDoc(doc(db, "students", id));
      await loadAdminData();
    } catch (e) {
      alert('حذف نہیں ہوا: ' + e.message);
    }
  };

  // ===================== DOWNLOAD CSV / EXCEL =====================
  window.downloadCSV = function() {
    if (!allStudents.length) { alert('کوئی ڈیٹا نہیں!'); return; }

    let csv = "\uFEFF";
    csv += "نمبر شمار,نام,واٹس ایپ نمبر,کل حاضری,حاضری کی تاریخیں\n";

    allStudents.forEach((s, i) => {
      const dates = Object.keys(s.attendance || {}).sort();
      csv += `${i + 1},"${s.name}","${s.number}",${dates.length},"${dates.join(' | ')}"\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `Alburhan_Attendance_${new Date().toISOString().slice(0, 10)}.csv`;
    link.click();
  };

  // ===================== INIT =====================
  document.getElementById('attDate').valueAsDate = new Date();

  // Enter key for admin login
  document.getElementById('adminPass').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.adminLogin();
  });
</script>

</body>
</html>
